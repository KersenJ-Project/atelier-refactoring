
# Nom du projet
name: Compilation et tests du projet Maven

# Déclencheurs du workflow
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  test-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # nécessaire pour que l'analyse SonarCloud puisse comparer avec l'historique (New Code)
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build, tests et analyse SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}

  build:
    needs: test-and-analyze
    runs-on: ubuntu-latest

    steps:
      # Récupérer le code
      - name: Récupérer le code
        uses: actions/checkout@v5

      # Installer Java 21
      - name: Installer le JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      # Donner les permissions au wrapper Maven
      - name: Donner accès en exécution au wrapper
        run: chmod +x mvnw

      # TODO 1 : Compiler et exécuter tous les tests
      - name: Compilation et tests du projet Maven
        run: ./mvnw -B clean verify

      # TODO 2 : Générer le rapport JaCoCo
      - name: Générer le rapport de couverture JaCoCo
        run: ./mvnw -B jacoco:report

      # TODO 3 : Publier le rapport JaCoCo
      - name: Publier le rapport JaCoCo
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: rapport-jacoco
          path: target/site/jacoco/
          if-no-files-found: ignore

      # TODO 4 : Empaqueter le projet
      - name: Empaqueter le projet Maven
        run: ./mvnw -B clean package

      # Publier le fichier JAR
      - name: Publier le JAR
        uses: actions/upload-artifact@v5
        with:
          name: application-jar
          path: target/*.jar
          if-no-files-found: error